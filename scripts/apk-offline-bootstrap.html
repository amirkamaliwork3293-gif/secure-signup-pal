<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KAMIX</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f8fafc;
        color: #0f172a;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Tahoma, sans-serif;
      }
      main {
        text-align: center;
        padding: 24px;
        max-width: 22rem;
      }
      p {
        line-height: 1.8;
      }
      button {
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="msg">در حال باز کردن برنامه…</p>
      <p><button type="button" id="retry" hidden>باز کردن برنامه</button></p>
    </main>
    <script>
      (function () {
        var dest = "__APP_URL__";
        var tries = 0;
        var max = 6;
        var btn = document.getElementById("retry");
        var msg = document.getElementById("msg");
        function go() {
          tries += 1;
          try {
            location.replace(dest);
          } catch (e) {}
          if (tries >= max) {
            if (msg)
              msg.textContent =
                "اگر قبلاً وارد شده‌اید، چند لحظه دیگر تلاش کنید تا نسخهٔ ذخیره‌شده باز شود.";
            if (btn) btn.hidden = false;
            return;
          }
          setTimeout(go, tries === 1 ? 80 : Math.min(1600, 200 * tries));
        }
        if (btn)
          btn.onclick = function () {
            location.replace(dest);
          };
        go();
      })();
    </script>
  </body>
</html>
